version: '3.8'

services:
  db:
    image: postgres:14
    container_name: lab9_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=library_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: flask_lab9
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@db/library_db
      - FLASK_APP=main.py
      - FLASK_DEBUG=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  mock-api:
    image: stoplight/prism:4
    container_name: library_mock_api
    restart: always
    ports:
      - "4010:4010"
    volumes:
      - ./api-spec.yml:/tmp/api-spec.yml:ro
    command: >
      mock -h 0.0.0.0 -p 4010 
      --cors 
      /tmp/api-spec.yml
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4010/v1/api/" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: