version: '3.8'

services:
  db:
    image: postgres:14
    container_name: lab4_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=library2_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: flask_lab4
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@db/library2_db
      - FLASK_APP=main.py
      - FLASK_DEBUG=1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: